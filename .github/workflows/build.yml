name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  # 打 v* 标签时需要用 GITHUB_TOKEN 创建 Release 并上传 APK
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 站点地址（CAS / 平台入口）不进仓库。整份 target.properties 以 base64 存在 Secret 里；
      # 没配也照样能构建，只是打出来的包登录不可用。
      - name: 注入站点配置
        env:
          TARGET_PROPERTIES_B64: ${{ secrets.TARGET_PROPERTIES_B64 }}
        run: |
          if [ -z "$TARGET_PROPERTIES_B64" ]; then
            echo "::warning::未配置 TARGET_PROPERTIES_B64，本次构建的登录功能不可用"
            exit 0
          fi
          printf '%s' "$TARGET_PROPERTIES_B64" | base64 -d > campusrun/target.properties

      # VPN 配置（远端、CA、tls-auth 密钥都在里面）整份不进仓库，同样走 Secret。
      - name: 注入 VPN 配置
        env:
          VPN_PROFILE_B64: ${{ secrets.VPN_PROFILE_B64 }}
        run: |
          if [ -z "$VPN_PROFILE_B64" ]; then
            echo "::warning::未配置 VPN_PROFILE_B64，本次构建的 VPN 功能不可用"
            exit 0
          fi
          printf '%s' "$VPN_PROFILE_B64" | base64 -d > campusrun/vpn-profile.ovpn

      # 应用内更新靠覆盖安装，签名必须跨版本一致。优先用固定的 release 密钥；
      # 没配 Secrets 时退回 debug 签名，并缓存 debug keystore，尽量避免每次换签名。
      - name: 注入 Release 签名
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.CAMPUSRUN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 CAMPUSRUN_KEYSTORE_BASE64，将发布 debug 签名 APK；更换 runner 缓存后可能无法覆盖安装"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > campusrun/release.keystore

      - name: 缓存 debug keystore（仅在未配置 release 签名时使用）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: 构建与单测
        working-directory: campusrun
        env:
          CAMPUSRUN_KEYSTORE_PATH: ${{ github.workspace }}/campusrun/release.keystore
          CAMPUSRUN_KEYSTORE_PASSWORD: ${{ secrets.CAMPUSRUN_KEYSTORE_PASSWORD }}
          CAMPUSRUN_KEY_ALIAS: ${{ secrets.CAMPUSRUN_KEY_ALIAS }}
          CAMPUSRUN_KEY_PASSWORD: ${{ secrets.CAMPUSRUN_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -f release.keystore ]; then
            ./gradlew --no-daemon assembleRelease testDebugUnitTest
          else
            ./gradlew --no-daemon assembleDebug testDebugUnitTest
          fi

      # 注意：公开仓库里，任何登录 GitHub 的人都能下载 artifact。
      # 如果你不希望带密钥的 APK 被广泛下载，把仓库设为私有，或删掉这一步只留构建产物在日志里。
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: campusrun-apk
          path: |
            campusrun/app/build/outputs/apk/release/app-release.apk
            campusrun/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 应用内的"检查更新"读的是 /releases/latest，所以 tag 构建必须同时创建 Release，
      # 否则只有 Actions artifact，App 下载不到。
      - name: 准备 Release 附件名
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: campusrun
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || APK=app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" "../campusrun-${GITHUB_REF_NAME}.apk"

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: campusrun-${{ github.ref_name }}.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
